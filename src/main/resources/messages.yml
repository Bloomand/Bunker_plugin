rules:
  - "&6&l--- Как играть в Бункер ---"
  - "&eЦель: &fостаться среди двух последних живых игроков."
  - "&e1. Лобби: &fигрок создаёт игру через /bunker create, остальные подключаются через /bunker join <ID> или /bunker games."
  - "&e2. Старт: &fведущий ждёт минимум игроков и запускает игру командой /bunker start."
  - "&e3. Карты: &fпосле старта каждый получает случайную характеристику из каждой категории. Свои карты смотрите через /bunker cards."
  - "&e4. Изучение: &fсначала все знакомятся со своими картами. Ведущий может досрочно завершить этап через /bunker pass после задержки."
  - "&e5. Личные ходы: &fживые игроки выступают по очереди и раскрывают по одной характеристике. Свой ход можно закончить через /bunker pass."
  - "&e6. Обсуждение: &fпосле личных ходов все обсуждают раскрытые характеристики и решают, кого исключить."
  - "&e7. Голосование: &fвыберите номер игрока через /bunker vote <номер> или меню /bunker open. Можно выбрать /bunker vote skip."
  - "&e8. Пропуск: &fесли пропуски и неголосовавшие набрали половину живых, голосование пропускается и расходуется один skip."
  - "&e9. Ничья: &fпри одинаковом максимальном количестве голосов начинается повторное голосование только между претендентами. В нём skip недоступен."
  - "&e10. Выбытие: &fвыбывший больше не ходит и не голосует, но его карты будут показаны в финале."
  - "&eВыход: &f/bunker leave, /spawn или отключение во время игры считаются добровольным выбыванием."
  - "&eПомощь: &f/bunker status — текущий этап; /bunker cards — свои карты; /bunker open — доступное меню."
  - "&6Ведущий: &f/bunker start запускает игру, /bunker cancel отменяет её, /bunker pass досрочно завершает доступный этап."

